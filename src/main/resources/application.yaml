info:
  app:
    description: Spring Boot API for RouteScout
    name: routescout
    version: 1.0.0
management:
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: openapi, swagger-ui
server:
  port: 5001
spring:
  application:
    name: routescout
  datasource:
    password: {password}
    url: jdbc:postgresql://dbserver:dbport/{database}
    username: {username}
  mvc:
    servlet:
      load-on-startup: 1
  profiles:
    active: '@spring.profiles.active@'
springdoc:
  packagesToScan: edu.citadel.api
  pathsToMatch: /v1, /**
  show-actuator: true
google:
  maps:
    key: ${GOOGLE_MAPS_KEY}